{% extends "base.html" %}

{%block title %}
Регистрация - VM
{% endblock %}

{% block content %}
<div class="logform">
    <h2>Регистрация</h2>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}    

    <form method="post" action="{{ url_for('register') }}">
        <label>
            ЛОГИН:<input type="text" name="login" required>
        </label>

        

        <label>
            ПОЧТА:<input type="email" name="email" required>
        </label>



        <label>
            ИМЯ:<input type="text" name="first_name" required>
        </label>

        

        <label>
            ФАМИЛИЯ:<input type="text" name="last_name" required>
        </label>


        <label>
            ПАРОЛЬ:<input type="password" name="password" required>
        </label>

        

        <button type="submit">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        <p>
            Уже есть аккаунт?
            <a href="/login">Войти</a>
        </p>
    </form>
</div>

{% endblock %}
