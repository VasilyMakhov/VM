{% extends "base.html" %}

{%block title %}
Вход - VM
{% endblock %}

{% block content %}

<div class="logform">
    <h2>Вход</h2>
    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}  
    <form method="post", action="{{ url_for('login') }}">
        <label>
            ЛОГИН:<input type="text" name="login">
        </label>

        

        <label>
            ПАРОЛЬ:<input type="password" name="password">
        </label>

        

        <button type="submit">ВОЙТИ</button>
        <p>
            Еще нет аккаунта?
            <a href="/register">Зарегистрироваться</a>
        </p>
    </form>
</div>

{% endblock %}
