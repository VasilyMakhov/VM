{% extends "base.html" %}

{% block title %}
Каталог - VM
{% endblock %}

{% block content %}

<div class="cat-head">
    <h2>Каталог товаров</h2>
    <p>Выберите товар, который вам приглянулся</p>
</div>

<div class="products">

    {% for product in products %}
    <div class="product">
        <a href="/product/{{ product[0]}}">
            <img src="{{ product[2] }}" alt="{{ product[1] }}">
        </a>
        <h3>
            <a href="/product/{{ product[0]}}">
                {{ product[1] }}
            </a>
        </h3>
        <p class="price">{{ product[3] }} Р</p>

    </div>
    {% endfor %}
</div>

{% endblock %}
